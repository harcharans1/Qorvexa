
<nav class="navbar" aria-label="Main navigation">
  <div class="container nav-inner">

    <!-- Qorvexa Logo -->
    <a
      routerLink="/"
      class="logo"
      (click)="closeMenu()"
      aria-label="Qorvexa home"
    >
      <img
        src="/images/qorvexa-logo.PNG"
        alt="Qorvexa"
        width="160"
        height="48"
      >
    </a>

    <!-- Mobile Menu Button -->
    <button
      class="hamburger"
      type="button"
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
      [attr.aria-expanded]="menuOpen"
      aria-controls="primary-navigation"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Navigation Links -->
    <ul
      id="primary-navigation"
      class="nav-links"
      [class.open]="menuOpen"
    >
      <li>
        <a
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()"
        >
          Home
        </a>
      </li>

      <li>
        <a
          routerLink="/products"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Products
        </a>
      </li>

      <li>
        <a
          routerLink="/features"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Features
        </a>
      </li>

      <li>
        <a
          routerLink="/pricing"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Pricing
        </a>
      </li>

      <li>
        <a
          routerLink="/about"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          About
        </a>
      </li>

      <li class="nav-account" *ngIf="!isLoggedIn">
        <a
          routerLink="/login"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Login
        </a>
      </li>

      <li *ngIf="isLoggedIn">
        <a
          routerLink="/profile"
          routerLinkActive="active"
          (click)="closeMenu()"
        >
          Profile
        </a>
      </li>

      <li *ngIf="isLoggedIn">
        <button
          type="button"
          class="nav-logout"
          (click)="logout()"
        >
          Logout
        </button>
      </li>

      <li class="nav-cta" *ngIf="!isLoggedIn">
        <a
          routerLink="/signup"
          routerLinkActive="active"
          class="btn btn-primary"
          (click)="closeMenu()"
        >
          Get Started <span aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>

  </div>
</nav>
