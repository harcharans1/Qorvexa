<div class="container section">
  <div class="list-header">
    <h1>My Resumes</h1>
    <button class="btn btn-primary" (click)="createNew()">+ New Resume</button>
  </div>

  <div *ngIf="loading">Loading...</div>

  <div class="resume-grid" *ngIf="!loading">
    <div class="card resume-card" *ngFor="let r of resumes">
      <h3>{{ r.title }}</h3>
      <p class="muted">{{ r.updated_at | date:'medium' }}</p>
      <a [routerLink]="['/resume', r.id]" class="btn btn-secondary">Edit</a>
      <button class="btn btn-secondary" style="margin-left:8px" (click)="deleteResume(r.id)">Delete</button>
    </div>

    <div class="card empty" *ngIf="resumes.length === 0">
      <p>No resumes yet.</p>
      <button class="btn btn-primary" (click)="createNew()">Create your first resume</button>
    </div>
  </div>
</div>
