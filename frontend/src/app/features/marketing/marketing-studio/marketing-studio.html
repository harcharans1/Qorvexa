<div class="container section">
  <h1>Marketing Studio</h1>
  <p class="muted">Generate captions (demo mode — clearly labeled).</p>

  <div class="studio-grid">
    <div>
      <label>Topic</label>
      <input [(ngModel)]="topic" placeholder="e.g. New product launch">

      <label>Tone</label>
      <select [(ngModel)]="tone">
        <option>Professional</option>
        <option>Casual</option>
        <option>Funny</option>
      </select>

      <label>Platform</label>
      <select [(ngModel)]="platform">
        <option>LinkedIn</option>
        <option>Instagram</option>
        <option>X</option>
        <option>Facebook</option>
      </select>

      <button class="btn btn-primary" (click)="generate()">Generate Caption</button>
    </div>

    <div class="card" *ngIf="generated">
      <h3>Generated Caption</h3>
      <pre>{{ generated }}</pre>
      <button class="btn btn-secondary" (click)="copy()">Copy</button>
    </div>
  </div>
</div>
