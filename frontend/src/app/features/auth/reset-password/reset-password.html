<div class="auth-page">
  <div class="auth-card">
    <div class="logo-center"><img src="/images/qorvexa-logo.PNG" alt="QORVEXA" height="48"></div>
    <h2>Set a new password</h2>
    <p class="muted">Choose a strong password with at least 8 characters.</p>
    <form (ngSubmit)="submit()">
      <div class="field"><label for="new-password">New password</label><input id="new-password" type="password" [(ngModel)]="password" name="password" minlength="8" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password" required></div>
      <p class="error" *ngIf="error" role="alert">{{ error }}</p>
      <p class="success" *ngIf="success" role="status">{{ success }}</p>
      <button class="btn btn-primary full" type="submit" [disabled]="loading">{{ loading ? 'Updating…' : 'Update password' }}</button>
    </form>
    <p class="switch"><a routerLink="/login">Back to sign in</a></p>
  </div>
</div>
