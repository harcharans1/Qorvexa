<div class="container section">
    <h1>Courses</h1>
    <p class="muted">Sample courses — clearly labeled as demo content.</p>

    <div *ngIf="loading">Loading...</div>

    <div class="course-grid" *ngIf="!loading">
        <div class="card course-card" *ngFor="let c of courses">
            <h3>{{ c.title }}</h3>
            <p>{{ c.description }}</p>
            <span class="badge">{{ c.category }}</span>
            <a [routerLink]="['/learn', c.id]" class="btn btn-secondary">View Lessons</a>
        </div>

        <div class="card empty" *ngIf="courses.length === 0">
            <p>No published courses yet.</p>
        </div>
    </div>
</div>
