<div class="container section" *ngIf="!loading && course">
  <h1>{{ course.title }}</h1>
  <p class="muted">{{ course.description }}</p>
  <span class="badge">{{ course.category }}</span>

  <h3>Lessons</h3>
  <div class="lesson-list">
    <div class="card lesson" *ngFor="let l of lessons">
      <strong>{{ l.title }}</strong>
      <p>{{ l.content }}</p>
    </div>
    <p *ngIf="lessons.length === 0">No lessons yet.</p>
  </div>
</div>
<div *ngIf="loading" class="container section">Loading...</div>
